// ============================================================
// 全問題にユニークIDを付与
// ============================================================
chapter1.forEach((item, i) => { item.id = "c1-" + i; item.chapter = "ch1"; });
chapter2.forEach((item, i) => { item.id = "c2-" + i; item.chapter = "ch2"; });

const allItems = [...chapter1, ...chapter2];
const questionMap = {};
allItems.forEach(item => questionMap[item.id] = item);

// ============================================================
// 選択肢のダミープール
// ============================================================
function buildAllAnswerPool() {
  const pool = new Set();
  allItems.forEach(item => {
    if (Array.isArray(item.a)) {
      item.a.forEach(x => pool.add(x));
    } else {
      pool.add(item.a);
    }
  });
  return Array.from(pool);
}
const allAnswerPool = buildAllAnswerPool();

// ============================================================
// ブックマーク管理
// ============================================================
const BOOKMARK_KEY = "ichimon_bookmarks";

function loadBookmarks() {
  try {
    const raw = localStorage.getItem(BOOKMARK_KEY);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function saveBookmarks(ids) {
  try { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(ids)); } catch (e) {}
}

let bookmarkedIds = loadBookmarks();

function isBookmarked(id) { return bookmarkedIds.includes(id); }

function toggleBookmark(id) {
  if (isBookmarked(id)) {
    bookmarkedIds = bookmarkedIds.filter(x => x !== id);
  } else {
    bookmarkedIds.push(id);
  }
  saveBookmarks(bookmarkedIds);
  updateBookmarkUI();
}

function updateBookmarkUI() {
  const count = bookmarkedIds.length;
  const badge = document.getElementById("bookmarkCountBadge");
  if (badge) badge.textContent = count;

  const bmBtn = document.getElementById("bookmarkModeBtn");
  const bmDesc = document.getElementById("bookmarkDesc");
  if (bmBtn) {
    if (count === 0) {
      bmBtn.disabled = true;
      if (bmDesc) bmDesc.textContent = "まだブックマークがありません";
    } else {
      bmBtn.disabled = false;
      if (bmDesc) bmDesc.textContent = count + " 問を出題できます";
    }
  }

  const quizBtn = document.getElementById("bookmarkBtn");
  if (quizBtn && quizOrder.length > 0 && currentIndex < quizOrder.length) {
    const q = quizOrder[currentIndex];
    if (isBookmarked(q.id)) quizBtn.classList.add("active");
    else quizBtn.classList.remove("active");
  }
}

function toggleBookmarkCurrent() {
  if (quizOrder.length === 0 || currentIndex >= quizOrder.length) return;
  toggleBookmark(quizOrder[currentIndex].id);
}

// ============================================================
// 状態
// ============================================================
let currentMode = null;
let quizOrder = [];
let currentIndex = 0;
let score = 0;
let answered = false;
let autoNextTimer = null;
let multiSelected = [];

// ============================================================
// ユーティリティ
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalizeAnswer(a) {
  return Array.isArray(a) ? a : [a];
}

function buildQuizList(source) {
  return source.map(item => {
    const arr = normalizeAnswer(item.a);
    return {
      id: item.id,
      q: item.q,
      correctArr: arr,
      correctText: arr.join("・"),
      isMulti: arr.length > 1,
      chapter: item.chapter
    };
  });
}

function makeSingleChoices(qItem) {
  const correctText = qItem.correctText;
  const pool = new Set();
  allAnswerPool.forEach(a => {
    if (a !== correctText) pool.add(a);
  });
  const candidates = Array.from(pool);
  const dummies = [];
  const used = new Set();
  while (dummies.length < 3 && candidates.length > 0) {
    const i = Math.floor(Math.random() * candidates.length);
    const c = candidates.splice(i, 1)[0];
    if (!used.has(c)) { dummies.push(c); used.add(c); }
  }
  return shuffle([correctText, ...dummies]);
}

function makeMultiChoices(qItem) {
  const correctArr = qItem.correctArr;
  const dummyCount = correctArr.length;
  const pool = new Set();
  allAnswerPool.forEach(a => {
    if (!correctArr.includes(a)) pool.add(a);
  });
  const candidates = Array.from(pool);
  const dummies = [];
  const used = new Set();
  while (dummies.length < dummyCount && candidates.length > 0) {
    const i = Math.floor(Math.random() * candidates.length);
    const c = candidates.splice(i, 1)[0];
    if (!used.has(c)) { dummies.push(c); used.add(c); }
  }
  return shuffle([...correctArr, ...dummies]);
}

// ============================================================
// 画面遷移
// ============================================================
function backToChapter() {
  if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
  document.getElementById("chapterScreen").style.display = "block";
  document.getElementById("quizArea").style.display = "none";
  document.getElementById("resultCard").classList.remove("show");
  document.getElementById("quizCard").style.display = "block";
  currentMode = null;
  updateBookmarkUI();
}

function startQuiz(mode) {
  if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
  currentMode = mode;

  let source;
  if (mode === "ch1") source = chapter1;
  else if (mode === "ch2") source = chapter2;
  else if (mode === "bookmark") {
    source = bookmarkedIds.map(id => questionMap[id]).filter(Boolean);
  } else {
    source = allItems;
  }

  if (!source || source.length === 0) {
    alert("出題できる問題がありません。");
    return;
  }

  quizOrder = shuffle(buildQuizList(source));
  currentIndex = 0;
  score = 0;

  document.getElementById("chapterScreen").style.display = "none";
  document.getElementById("quizArea").style.display = "block";
  document.getElementById("resultCard").classList.remove("show");
  document.getElementById("quizCard").style.display = "block";

  renderQuestion();
}

// ============================================================
// 問題表示
// ============================================================
function renderQuestion() {
  answered = false;
  multiSelected = [];
  const q = quizOrder[currentIndex];

  const pct = (currentIndex / quizOrder.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent =
    (currentIndex + 1) + " / " + quizOrder.length + " 問";

  const tag = document.getElementById("qTag");
  if (q.chapter === "ch1") tag.textContent = "第1章";
  else if (q.chapter === "ch2") tag.textContent = "第2章";
  else tag.textContent = "問題";

  document.getElementById("question").textContent = q.q;

  const noteEl = document.getElementById("selectAllNote");
  if (q.isMulti) noteEl.style.display = "block";
  else noteEl.style.display = "none";

  const choicesEl = document.getElementById("choices");
  choicesEl.innerHTML = "";
  const choices = q.isMulti ? makeMultiChoices(q) : makeSingleChoices(q);
  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.textContent = c;
    if (q.isMulti) {
      btn.onclick = () => toggleMultiChoice(btn, c);
    } else {
      btn.onclick = () => selectSingleAnswer(btn, c, q);
    }
    choicesEl.appendChild(btn);
  });

  const confirmWrap = document.getElementById("confirmWrap");
  if (q.isMulti) {
    confirmWrap.style.display = "flex";
    document.getElementById("confirmBtn").disabled = true;
  } else {
    confirmWrap.style.display = "none";
  }

  const fb = document.getElementById("feedback");
  fb.className = "feedback";
  fb.textContent = "";

  updateBookmarkUI();
}

function selectSingleAnswer(btn, choice, q) {
  if (answered) return;
  answered = true;

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === q.correctText) b.classList.add("correct");
  });

  const fb = document.getElementById("feedback");
  if (choice === q.correctText) {
    score++;
    fb.className = "feedback ok show";
    fb.textContent = "正解！ " + q.correctText;
  } else {
    btn.classList.add("wrong");
    fb.className = "feedback ng show";
    fb.textContent = "残念… 正解は「" + q.correctText + "」です。";
  }

  const delay = (choice === q.correctText) ? 900 : 1600;
  autoNextTimer = setTimeout(nextQuestion, delay);
}

function toggleMultiChoice(btn, text) {
  if (answered) return;
  const idx = multiSelected.indexOf(text);
  if (idx >= 0) {
    multiSelected.splice(idx, 1);
    btn.classList.remove("selected");
  } else {
    multiSelected.push(text);
    btn.classList.add("selected");
  }
  document.getElementById("confirmBtn").disabled = multiSelected.length === 0;
}

function confirmMultiAnswer() {
  if (answered) return;
  const q = quizOrder[currentIndex];
  if (!q.isMulti) return;
  if (multiSelected.length === 0) return;

  answered = true;

  const correctSet = new Set(q.correctArr);
  const selectedSet = new Set(multiSelected);

  let isCorrect = correctSet.size === selectedSet.size;
  if (isCorrect) {
    for (const c of correctSet) {
      if (!selectedSet.has(c)) { isCorrect = false; break; }
    }
  }

  const buttons = document.querySelectorAll(".choice");
  buttons.forEach(b => {
    b.disabled = true;
    b.classList.remove("selected");
    if (correctSet.has(b.textContent)) {
      b.classList.add("correct");
    } else if (selectedSet.has(b.textContent)) {
      b.classList.add("wrong");
    }
  });

  const fb = document.getElementById("feedback");
  if (isCorrect) {
    score++;
    fb.className = "feedback ok show";
    fb.textContent = "正解！ " + q.correctText;
  } else {
    fb.className = "feedback ng show";
    fb.textContent = "残念… 正解は「" + q.correctText + "」です。";
  }

  document.getElementById("confirmWrap").style.display = "none";

  const delay = isCorrect ? 1200 : 2000;
  autoNextTimer = setTimeout(nextQuestion, delay);
}

function nextQuestion() {
  if (autoNextTimer) { clearTimeout(autoNextTimer); autoNextTimer = null; }
  currentIndex++;
  if (currentIndex >= quizOrder.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById("progressFill").style.width = "100%";
  document.getElementById("progressText").textContent =
    quizOrder.length + " / " + quizOrder.length + " 問";
  document.getElementById("quizCard").style.display = "none";

  const result = document.getElementById("resultCard");
  result.classList.add("show");

  document.getElementById("scoreBig").innerHTML =
    score + " <small>/ " + quizOrder.length + " 問正解</small>";

  const rate = score / quizOrder.length;
  let comment = "";
  if (rate === 1) comment = "全問正解！素晴らしいです。";
  else if (rate >= 0.8) comment = "よくできました！理解が深まっています。";
  else if (rate >= 0.6) comment = "まずまずです。間違えた問題を見直しましょう。";
  else if (rate >= 0.4) comment = "もう少し！繰り返し挑戦して覚えましょう。";
  else comment = "基礎からしっかり復習しましょう。";
  document.getElementById("comment").textContent = comment;
}

function restart() {
  if (currentMode) startQuiz(currentMode);
}

backToChapter();
</script>
